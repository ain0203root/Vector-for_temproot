name: Auto build on master changes

on:
  # A README edit is a normal push too, so it automatically reaches this trigger.
  # All master changes are built, not only documentation changes.
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-core:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Core build and Canary release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Stable release commits are published by the v* tag workflow.
          # Do not also start a Canary build for the same commit.
          if [[ "$COMMIT_SUBJECT" == "Release Vector"* ]]; then
            echo "Release commit detected; waiting for its v* tag."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/core.yml/dispatches" \
            --data '{"ref":"master"}'
